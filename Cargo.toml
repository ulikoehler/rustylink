[package]
name = "rustylink"
version = "3.1.0"
edition = "2024"
homepage = "https://github.com/ulikoehler/rustylink"
repository = "https://github.com/ulikoehler/rustylink"
description = "Visualize & analyze Simulink .slx files"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
camino = "1.2"
zip = { version = "~9.1", default-features = false, features = ["deflate"] }
clap = { version = "4.6", features = ["derive"] }
walkdir = "2.3"
rayon = "1.12"
html-escape = "0.3"
quick-xml = "0.42"
bincode = { version = "2.0.1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
once_cell = "1.20"

[features]
# Optional GUI visualization using egui/eframe
highlight = ["dep:syntect"]
egui = [
	"dep:eframe",
	"dep:egui",
	"dep:rfd",
	"dep:syntect",
	"dep:liveplot",
	"dep:egui_material_icons",
]
## Optional mask evaluation (parses very small subset of MATLAB mask scripts to show display text)
mask = []
## Enable interactive dashboard elements (custom widget renderers, liveplot scopes, editable constants).
## Without this feature, dashboard blocks render with simple icons only.
dashboard = ["egui"]

[dependencies.egui]
version = "0.37"
optional = true

[dependencies.eframe]
version = "0.37"
optional = true
default-features = false
features = ["glow", "default_fonts", "wayland", "x11"]

[dependencies.syntect]
version = "5.3"
optional = true

[dependencies.liveplot]
#path = "../liveplot-rs"
version = "~2.5"
optional = true
default-features = false
features = ["tiles", "fft", "parquet"]

[dependencies.rfd]
version = "0.17.2"
optional = true

# Must track the same egui generation as `eframe`/`egui`.
[dependencies.egui_material_icons]
version = "0.9"
optional = true

[dev-dependencies]
tempfile = "3.10"

[[example]]
name = "analyze_model_blocks"
required-features = ["egui"]

[[example]]
name = "dump_block_icons"
required-features = ["egui"]

