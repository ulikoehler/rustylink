[package]
name = "rustylink"
version = "3.0.1"
edition = "2024"
homepage = "https://github.com/ulikoehler/rustylink"
repository = "https://github.com/ulikoehler/rustylink"
description = "Visualize & analyze Simulink .slx files"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
camino = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.3"
rayon = "1.11"
html-escape = "0.2"
quick-xml = "0.41"
bincode = { version = "2.0.1", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
once_cell = "1.20"

[features]
# Optional GUI visualization using egui/eframe
highlight = ["dep:syntect"]
egui = [
	"dep:eframe",
	"dep:egui",
	"dep:egui_extras",
	"dep:rfd",
	"dep:usvg",
	"dep:rust-embed",
	"dep:syntect",
	"dep:liveplot",
	"dep:egui_phosphor_icons",
]
## Optional mask evaluation (parses very small subset of MATLAB mask scripts to show display text)
mask = []
## Enable interactive dashboard elements (custom widget renderers, liveplot scopes, editable constants).
## Without this feature, dashboard blocks render with simple icons only.
dashboard = ["egui"]

[dependencies.egui]
version = "0.36"
optional = true

[dependencies.eframe]
version = "0.36"
optional = true
default-features = false
features = ["glow", "default_fonts", "wayland", "x11"]

[dependencies.syntect]
version = "5.3"
optional = true

[dependencies.egui_extras]
version = "0.36"
optional = true
default-features = false
features = ["svg"]

[dependencies.usvg]
# Must match the usvg version used by `egui_extras` (via `resvg`)
# to avoid type mismatches when passing `usvg::Options` to
# `egui_extras::image::load_svg_bytes_with_size`.
version = "0.45"
optional = true
default-features = false
features = ["text", "system-fonts"]

[dependencies.rust-embed]
version = "8.11.0"
optional = true
features = ["compression"]

[dependencies.liveplot]
#path = "../liveplot-rs"
version = "2.2.0"
optional = true
default-features = false
features = ["tiles", "fft", "parquet"]

[dependencies.rfd]
version = "0.17.2"
optional = true

# Must track the same egui generation as `eframe`/`egui` (0.35) so the
# `FontDefinitions` types match for `add_fonts`.
[dependencies.egui_phosphor_icons]
version = "0.5"
optional = true

[dev-dependencies]
tempfile = "3.10"
usvg = "0.45"

[[example]]
name = "analyze_model_blocks"
required-features = ["egui"]

